{% macro cat(message, mood='') %}
<div class="mascot {{ mood }}">
  <svg class="cat" viewBox="0 0 120 108" width="88" height="79" aria-hidden="true">
    <!-- pointy cat ears -->
    <g class="ear ear-l">
      <path d="M34,42 L40,13 L58,33 Z" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M41,33 L44,21 L52,31 Z" fill="#f0c9c0"/>
    </g>
    <g class="ear ear-r">
      <path d="M86,42 L80,13 L62,33 Z" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M79,33 L76,21 L68,31 Z" fill="#f0c9c0"/>
    </g>
    <!-- chubby "loaf" head (rounded square = huggable) -->
    <path d="M32,34 h56 a12,12 0 0 1 12,12 v34 a20,20 0 0 1 -20,20
             h-40 a20,20 0 0 1 -20,-20 v-34 a12,12 0 0 1 12,-12 z"
          fill="#f3e3d3" stroke="#b5651d" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- whiskers (short + perky) -->
    <g stroke="#c4b8a8" stroke-width="1.8" stroke-linecap="round">
      <line x1="27" y1="76" x2="13" y2="72"/>
      <line x1="28" y1="82" x2="14" y2="85"/>
      <line x1="93" y1="76" x2="107" y2="72"/>
      <line x1="92" y1="82" x2="106" y2="85"/>
    </g>
    <!-- big soft blush -->
    <ellipse cx="37" cy="80" rx="7.5" ry="5" fill="#f0c9c0" opacity=".8"/>
    <ellipse cx="83" cy="80" rx="7.5" ry="5" fill="#f0c9c0" opacity=".8"/>
    <!-- big sparkly eyes, set low -->
    <g class="eye">
      <circle cx="48" cy="68" r="8" fill="#2b2620"/>
      <circle cx="50.8" cy="64.4" r="2.9" fill="#fff"/>
      <circle cx="45.2" cy="70.6" r="1.3" fill="#fff" opacity=".85"/>
    </g>
    <g class="eye">
      <circle cx="72" cy="68" r="8" fill="#2b2620"/>
      <circle cx="74.8" cy="64.4" r="2.9" fill="#fff"/>
      <circle cx="69.2" cy="70.6" r="1.3" fill="#fff" opacity=".85"/>
    </g>
    <!-- happy closed eyes ( ^ ^ ) -->
    <g class="lid" stroke="#2b2620" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M41,69 Q48,61 55,69"/>
      <path d="M65,69 Q72,61 79,69"/>
    </g>
    <!-- tiny nose + w mouth -->
    <path d="M57,77 Q60,75.2 63,77 Q60,80 57,77 Z" fill="#d98a63"/>
    <path d="M60,79 Q57.5,83 54.5,80.5 M60,79 Q62.5,83 65.5,80.5" stroke="#2b2620" stroke-width="1.9" fill="none" stroke-linecap="round"/>
    <!-- resting paws tucked under chin -->
    <g class="paws">
      <ellipse cx="49" cy="100" rx="9" ry="6.5" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.2"/>
      <ellipse cx="71" cy="100" rx="9" ry="6.5" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.2"/>
      <path d="M46,96 L46,101 M52,96 L52,101 M68,96 L68,101 M74,96 L74,101" stroke="#b5651d" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    </g>
    <!-- paws up, covering eyes (no-peek mode) -->
    <g class="paw-cover">
      <ellipse cx="48" cy="68" rx="10.5" ry="8.5" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.2"/>
      <ellipse cx="72" cy="68" rx="10.5" ry="8.5" fill="#f3e3d3" stroke="#b5651d" stroke-width="2.2"/>
      <path d="M44,61 L44,68 M51,60 L51,67 M69,60 L69,67 M76,61 L76,68" stroke="#b5651d" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>
    </g>
  </svg>
  <div class="bubble">{{ message }}</div>
</div>
{% endmacro %}
